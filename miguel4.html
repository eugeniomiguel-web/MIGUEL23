<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance — Attendance Tracker</title>
  <link rel="stylesheet" href="style2.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Attendance Records</h1>

    <nav class="row">
      <a class="btn" href="miguel.html">Events</a>
      <a class="btn" href="miguel3.html">Students</a>
      <a class="btn" href="miguel4.html">Attendance</a>
      <a class="btn" href="miguel2.html">Open Scanner →</a>
    </nav>

    <section id="attendance" class="panel">
      <h2>Attendance Records</h2>

      <label>Filter by event:
        <select id="attendanceEventFilter">
          <option value="">-- All events --</option>
        </select>
      </label>

      <div class="row">
        <button id="exportAttendance" class="btn">Export CSV</button>
        <button id="clearAttendance" class="btn danger">Clear all attendance</button>
      </div>

      <table id="attendanceTable" class="table">
        <thead>
          <tr>
            <th>Event</th><th>Student ID</th><th>Name</th><th>Date</th><th>Time</th><th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <footer>
      <small>Data stored locally in your browser (localStorage). Open scanner on HTTPS or localhost.</small>
    </footer>

    <!-- QR modal (hidden by default) -->
    <div id="qrModal" class="qr-modal" style="display:none;">
      <div class="panel">
        <h3>QR for <span id="qrStudentId"></span></h3>
        <canvas id="qrCanvas" width="260" height="260" style="display:block;margin:8px auto;border:1px solid #eee;"></canvas>
        <div class="row" style="justify-content:center;">
          <button id="downloadQrBtn" class="btn">Download PNG</button>
          <button id="printQrBtn" class="btn">Print</button>
          <button id="closeQrBtn" class="btn danger">Close</button>
        </div>
      </div>
    </div>

  </div>

  <script src="main.js"></script>
</body>
</html>
